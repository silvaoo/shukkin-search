# =========================================================
# 出勤通知の自動送信
#
# 5分おきに動き、その時刻に通知すべき人がいれば送る。
# 手動で動かすこともできる（Actions画面の Run workflow から）。
# =========================================================
name: 出勤通知の送信

on:
  schedule:
    # 5分ごとに実行する。時刻は世界標準時で書く決まりだが、
    # 5分おきなので時差は気にしなくてよい。
    # 注意: GitHub 側の混み具合で、実際の実行は数分ずれることがある。
    - cron: '*/5 * * * *'

  # 手動実行。動作確認のときに使う
  workflow_dispatch:
    inputs:
      test:
        description: '時刻に関係なく、いますぐ1件送る'
        type: boolean
        default: false

# 同時に複数動かないようにする
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 実行時刻を記録（ずれの確認用）
        run: |
          echo "予定より何分遅れて動いたかを見るための記録"
          echo "世界標準時: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "日本時間　: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"

      - name: 通知を送る
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            node scripts/send-notify.js --test
          else
            node scripts/send-notify.js
          fi
