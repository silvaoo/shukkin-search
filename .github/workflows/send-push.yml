name: プッシュ通知を送信

on:
  workflow_dispatch:
    inputs:
      title:
        description: 通知タイトル
        required: true
      body:
        description: 通知本文
        required: true
      template:
        description: テンプレートID
        required: true
      apps:
        description: 対象ダイヤコード（空白区切り）
        required: true
      confirm:
        description: 本当に送信するか
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Firebase Admin SDK をインストール
        run: npm install firebase-admin
      
      - name: プッシュ通知を送信
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: |
          node - <<'SCRIPT'
          const admin = require('firebase-admin');
          
          // 環境変数から Firebase 設定を読み込む
          const firebaseConfig = JSON.parse(process.env.FIREBASE_CONFIG);
          const adminKey = JSON.parse(process.env.FIREBASE_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(adminKey),
            databaseURL: firebaseConfig.databaseURL,
            projectId: firebaseConfig.projectId
          });
          
          const db = admin.firestore();
          const messaging = admin.messaging();
          
          const title = '${{ github.event.inputs.title }}';
          const body = '${{ github.event.inputs.body }}';
          const template = '${{ github.event.inputs.template }}';
          const appsInput = '${{ github.event.inputs.apps }}';
          const confirm = '${{ github.event.inputs.confirm }}' === 'true';
          
          const appCodes = appsInput.trim().split(/\s+/).filter(c => c.length > 0);
          
          console.log('📱 プッシュ送信');
          console.log(`  テンプレート: ${template}`);
          console.log(`  タイトル: ${title}`);
          console.log(`  本文: ${body}`);
          console.log(`  対象: ${appCodes.join(', ')}`);
          console.log(`  実行: ${confirm ? 'YES' : 'NO（確認のみ）'}`);
          
          if(!confirm){
            console.log('\\n✓ 確認完了。本当に送信するには「② 本当に送る」を押してください。');
            process.exit(0);
          }
          
          // Firestore から登録トークンを取得
          (async () => {
            try {
              const tokensToSend = new Set();
              
              // アプリコードごとに Firestore をクエリ
              for(const appCode of appCodes){
                const snapshot = await db.collection('push_registrations')
                  .where('apps', 'array-contains', appCode)
                  .get();
                
                snapshot.forEach(doc => {
                  const data = doc.data();
                  if(data.token && data.token.trim()){
                    tokensToSend.add(data.token);
                  }
                });
              }
              
              if(tokensToSend.size === 0){
                console.log('\\n⚠️  登録トークンが見つかりません。');
                process.exit(0);
              }
              
              console.log(`\\n📤 ${tokensToSend.size} 端末に送信します…`);
              
              const message = {
                notification: {
                  title: title,
                  body: body
                },
                data: {
                  template: template,
                  sentAt: new Date().toISOString()
                }
              };
              
              // マルチキャストで複数端末に一度に送信
              const tokens = Array.from(tokensToSend);
              const response = await messaging.sendMulticast(message, tokens);
              
              console.log(`✅ 成功: ${response.successCount}件`);
              if(response.failureCount > 0){
                console.log(`⚠️  失敗: ${response.failureCount}件`);
              }
              
              process.exit(0);
            } catch(err){
              console.error('❌ エラー:', err.message);
              process.exit(1);
            }
          })();
          SCRIPT

