<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ABBR}}を共有</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body {
        background: {{SPLASH_BG}};
        color: {{TEXT_D}};
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
    }
    .icon { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13px; color: #9a9aa5; margin-bottom: 28px; line-height: 1.6; }
    .btn {
        width: 100%;
        max-width: 360px;
        padding: 16px;
        border: none;
        border-radius: 12px;
        color: {{SOON_TX}};
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-share { background: linear-gradient(135deg, {{SOON_A}}, {{SOON_B}}); }
    .btn-copy { background: #4a4a55; color: #fff; }
    .back-link { margin-top: 20px; font-size: 13px; color: {{COLOR_DARK}}; text-decoration: none; }
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        white-space: nowrap;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
    <img class="icon" src="icons/icon-192.png" alt="{{ABBR}}アイコン">
    <h1>{{ABBR}}を共有</h1>
    <p>同僚にこのアプリのリンクを送ることができます。<br>下のボタンからお好きな方法で共有してください。</p>

    <button class="btn btn-share" onclick="doShare()">📤 共有する</button>
    <button class="btn btn-copy" onclick="copyLink()">🔗 リンクをコピー</button>

    <a class="back-link" href="./">← アプリに戻る</a>

    <div id="toast" class="toast"></div>

    <script>
        /* このページのアドレスと、共有するときに添える文章 */
        const APP_URL  = "https://silvaoo.github.io/{{REPO}}/";
        const APP_TEXT = "{{ABBR}}(出退勤検索くん) {{DIA_NAME}}";

        /* 画面の下に短いメッセージを出す */
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function(){ t.classList.remove('show'); }, 2200);
        }

        /* 端末標準の共有シート(Web Share API)を呼び出す。
           対応していない端末では、代わりにリンクのコピーを行う。 */
        async function doShare() {
            if (navigator.share) {
                try {
                    await navigator.share({ title: APP_TEXT, text: APP_TEXT, url: APP_URL });
                } catch (e) {
                    /* 利用者が取り消した場合などは何もしない */
                }
            } else {
                copyLink();
            }
        }

        /* リンクをクリップボードに写す。古い端末向けの手当ても入れてある。 */
        function copyLink() {
            navigator.clipboard.writeText(APP_URL).then(function(){
                showToast('📋 リンクをコピーしました');
            }).catch(function(){
                const ta = document.createElement('textarea');
                ta.value = APP_URL;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('📋 リンクをコピーしました');
            });
        }
    </script>
</body>
</html>
